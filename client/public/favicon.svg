<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded Brand Shield -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)"/>
  <!-- Glowing border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Code Brackets & Slash </> -->
  <g filter="url(#shadow)" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bracket < -->
    <path d="M22 22 L14 32 L22 42"/>
    <!-- Slash / -->
    <path d="M37 18 L27 46"/>
    <!-- Right bracket > -->
    <path d="M42 22 L50 32 L42 42"/>
  </g>
</svg>
